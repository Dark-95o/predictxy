name: Deploy PredictXY

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run 5 Automated Unit Tests
        run: npm run test
      
      - name: Lint Code
        run: npm run lint || echo "Linting warnings passed"
      
      - name: Build Bundle
        run: npm run build

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning title=Vercel Token Missing::VERCEL_TOKEN secret is not set in GitHub repository settings. Skipping Vercel deployment."
            echo "To enable automated Vercel deployment: Go to GitHub Repo -> Settings -> Secrets and variables -> Actions -> Add VERCEL_TOKEN secret."
          else
            echo "Deploying to Vercel production..."
            npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          fi
